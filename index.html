<!DOCTYPE html>
<html lang="it">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Canvas 2D Simulator</title>
      <style>
         * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
         }
         body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e17;
            color: #e2e8f0;
            overflow: hidden;
         }
         #canvas {
            display: block;
            cursor: crosshair;
            background: #111822;
         }
         .ui-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            font-size: 14px;
            z-index: 100;
            user-select: none;
         }
         .ui-stat {
            margin: 4px 0;
            display: flex;
            gap: 8px;
            align-items: center;
         }
         .ui-label {
            color: #94a3b8;
            min-width: 50px;
         }
         .ui-value {
            color: #22d3ee;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
         }
         button {
            background: #1e293b;
            border: 1px solid #475569;
            color: #e2e8f0;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
         }
         button:hover {
            background: #334155;
            border-color: #64748b;
         }
         button:active {
            transform: translateY(1px);
         }
      </style>
   </head>
   <body>
      <canvas id="canvas"></canvas>

      <div class="ui-panel">
         <div class="ui-stat">
            <span class="ui-label">FPS:</span>
            <span class="ui-value" id="fps">60</span>
         </div>
         <div class="ui-stat">
            <span class="ui-label">Oggetti:</span>
            <span class="ui-value" id="count">0</span>
         </div>
         <div class="ui-stat">
            <button id="reset">Reset Scena</button>
         </div>
         <div class="ui-stat">
            <button id="spawn-object">Spawn</button>
         </div> <div id="output"></div>
         </div>
      </div>

      <script type="module" src="/src/main.ts"></script>
   </body>
</html>
